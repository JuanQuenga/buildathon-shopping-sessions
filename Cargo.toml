[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[features]
default = ["narrow", "swcb"]
narrow = []
swcb = []

[dependencies]
# aggregate/output agent: add your dependencies below this line.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
